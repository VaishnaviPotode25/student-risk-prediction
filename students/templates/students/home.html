<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Risk Prediction</title>
</head>
<body>
    <h1>{{ project_name }}</h1>
    <p>Total students in database: {{ total_students }}</p>
    <p>
        <a href="{% url 'student_list' %}">View students</a> |
        <a href="{% url 'add_student' %}">Add student</a> |
        <a href="{% url 'predict_student' %}">Predict risk</a> |
        <a href="{% url 'dashboard' %}">Dashboard</a>
    </p>

    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit">Log out ({{ user.username }})</button>
    </form>
    {% else %}
    <p><a href="{% url 'login' %}">Log in</a></p>
    {% endif %}

    <h2>Planned features</h2>
    <ul>
        {% for feature in features %}
            <li>{{ feature }}</li>
        {% endfor %}
    </ul>
</body>
</html>
