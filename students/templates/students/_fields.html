{% for field in form %}
<div class="field{% if field.name == 'name' or field.name == 'actual_outcome' %} wide{% endif %}{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
{% endfor %}
